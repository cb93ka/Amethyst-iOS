name: Hosted build

# The upstream workflows target a self-hosted runner (J316sAP), which a fork
# has no access to. This one builds the same packages on GitHub's own macOS
# runners, where Xcode - and therefore the iPhoneOS SDK and actool - is
# already installed.

on:
  push:
    branches:
      - motion-system
  workflow_dispatch:

jobs:
  build:
    name: Build iOS package
    # Amethyst uses iOS 26 APIs (UIBarButtonItem.sharesBackground and friends),
    # so it needs an image whose default Xcode ships the iOS 26 SDK
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          # Temurin no longer publishes a JDK 8 for macOS on ARM; Zulu does,
          # and it is the same vendor whose runtimes Amethyst ships
          distribution: zulu
          java-version: '8'

      - name: Install build dependencies
        run: brew install cmake ldid wget make

      - name: Report toolchain
        run: |
          echo "Xcode:  $(xcodebuild -version | head -1)"
          echo "SDK:    $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "javac:  $("$JAVA_HOME/bin/javac" -version 2>&1)"
          echo "cmake:  $(cmake --version | head -1)"
          echo "gmake:  $(gmake --version | head -1)"

      - name: Build ipa and tipa
        run: |
          # The Makefile insists on JDK 8; point it straight at the one
          # setup-java installed instead of relying on java_home lookup
          gmake -j$(sysctl -n hw.ncpu) package \
            PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"
          gmake -j$(sysctl -n hw.ncpu) package \
            PLATFORM=2 BOOTJDK="$JAVA_HOME/bin" TROLLSTORE_JIT_ENT=1

      - name: List artifacts
        if: always()
        run: ls -lah artifacts/ || true

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-ipa
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-trollstore-tipa
          path: artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa
          if-no-files-found: error
